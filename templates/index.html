<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST Digit Classifier</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #eee;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        canvas {
            cursor: crosshair;
            background-color: #eee;
            border-radius: 16px;
        }
        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 20px 40px;
            font-size: 32px;
            font-family: monospace;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        #clear-btn {
            background-color: #e74c3c;
            color: white;
        }
        #predict-btn {
            background-color: #2ecc71;
            color: white;
        }
        #result {
            font-size: 32px;
            text-align: center;
        }
        .container {
            display: flex;
            gap: 40px;
            align-items: stretch;
            margin-top: 20px;
        }
        .left-panel, .right-panel {
            border: 2px solid #555;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 604px;
        }
    </style>
</head>
<body>
    <h1>Draw a Digit</h1>
    <div class="container">
        <div class="left-panel">
            <canvas id="canvas" width="560" height="560"></canvas>
            <div class="buttons">
                <button id="clear-btn">Clear</button>
                <button id="predict-btn">Predict</button>
            </div>
        </div>
        <div class="right-panel">
            <div id="result"></div>
        </div>
    </div>
</body>
</html>
